[project]
name = "adversarial-mcp"
version = "0.1.0"
description = "MCP server exposing the adversarial review framework as callable tools: run domain reviews, check vetoes, record/query verdicts, inventory agents and skills."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",  # v1 API (FastMCP); v2 renamed to MCPServer
    "pydantic>=2.0",
]

[project.scripts]
adversarial-mcp = "adversarial_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adversarial_mcp"]
