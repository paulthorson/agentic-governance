<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#0f172a"/>

  <!-- title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">The Governed Adversarial Review Loop</text>

  <!-- Producer -->
  <rect x="40" y="90" width="200" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#38bdf8">Producer</text>
  <text x="140" y="142" text-anchor="middle" font-size="12" fill="#94a3b8">Engineer · QA · UXer</text>
  <text x="140" y="158" text-anchor="middle" font-size="12" fill="#94a3b8">UXR · PM · BA · SM · CEO</text>

  <!-- in_review -->
  <rect x="350" y="90" width="200" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#f59e0b">in_review</text>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#94a3b8">ticket assigned to</text>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#94a3b8">matching adversary</text>

  <!-- Adversary -->
  <rect x="660" y="90" width="200" height="90" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="760" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#a78bfa">Adversary Agent</text>
  <text x="760" y="142" text-anchor="middle" font-size="12" fill="#94a3b8">domain-matched reviewer</text>
  <text x="760" y="158" text-anchor="middle" font-size="12" fill="#94a3b8">runs checks + skills</text>

  <!-- arrow producer -> in_review -->
  <line x1="240" y1="135" x2="348" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="294" y="125" text-anchor="middle" font-size="11" fill="#94a3b8">finish → move</text>

  <!-- arrow in_review -> adversary -->
  <line x1="550" y1="135" x2="658" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="604" y="125" text-anchor="middle" font-size="11" fill="#94a3b8">claim</text>

  <!-- Verdict box -->
  <rect x="350" y="300" width="200" height="90" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="450" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#34d399">Verdict</text>
  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#94a3b8">KICK_BACK / ALLOW</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#94a3b8">recorded to ledger</text>

  <!-- arrow adversary -> verdict -->
  <line x1="760" y1="180" x2="760" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="760" y1="260" x2="552" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="252" text-anchor="middle" font-size="11" fill="#94a3b8">post verdict</text>

  <!-- KICK_BACK arrow (red) back to producer -->
  <path d="M 450 300 L 450 250 L 140 250 L 140 182" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="300" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#f87171">KICK_BACK → fix + resubmit</text>

  <!-- ALLOW arrow (green) to done -->
  <rect x="660" y="300" width="200" height="90" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="760" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#34d399">Proceed / done</text>
  <text x="760" y="352" text-anchor="middle" font-size="12" fill="#94a3b8">or human gate for</text>
  <text x="760" y="368" text-anchor="middle" font-size="12" fill="#94a3b8">cost / schedule / confidence</text>
  <line x1="552" y1="345" x2="658" y2="345" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="605" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#4ade80">ALLOW</text>

  <!-- VETO note -->
  <rect x="40" y="300" width="200" height="90" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#f87171">VETO</text>
  <text x="140" y="352" text-anchor="middle" font-size="12" fill="#fca5a5">irrecoverable harm</text>
  <text x="140" y="368" text-anchor="middle" font-size="12" fill="#fca5a5">only a human clears</text>
  <line x1="350" y1="345" x2="242" y2="345" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>

  <!-- footer -->
  <text x="450" y="470" text-anchor="middle" font-size="12" fill="#64748b">Every ticket goes to review. Producers never mark work done directly.</text>
  <text x="450" y="492" text-anchor="middle" font-size="12" fill="#64748b">Adversaries hold hard vetoes; only a human clears one.</text>
</svg>
